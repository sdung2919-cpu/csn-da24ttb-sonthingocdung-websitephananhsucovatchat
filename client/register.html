<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký tài khoản | CSVC - TVU</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: rgba(0,0,0,0.4);">
  <div class="center-box">
    <div class="login-card" style="width: 480px;">
      <div style="background: var(--tvu-yellow); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
        <i class="fa-solid fa-user-plus" style="font-size: 28px;"></i>
      </div>
      <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
      <p style="font-size: 13px; color: #666; margin-top: 4px;">Dành cho Sinh viên và Giảng viên trường</p>
      <div class="slogan-pill">“Tận tâm - Minh bạch - Thân thiện - Sáng tạo”</div>

      <form id="registerForm" style="text-align: left;">
        <div class="form-group">
          <label>Họ và tên <span class="required">*</span></label>
          <input type="text" id="fullname" class="form-control" placeholder="Ví dụ: Sơn Thị Ngọc Dung" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Mã số (MSSV/Mã CB) <span class="required">*</span></label>
            <input type="text" id="user_code" class="form-control" placeholder="Ví dụ: DA24TTB" required>
          </div>
          <div class="form-group">
            <label>Vai trò <span class="required">*</span></label>
            <select id="role" class="form-control" required>
              <option value="student">Sinh viên</option>
              <option value="lecturer">Giảng viên</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Email nhà trường (@st.tvu.edu.vn / @tvu.edu.vn) <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="dungda24ttb@st.tvu.edu.vn" required>
        </div>
        <div class="form-group">
          <label>Số điện thoại liên hệ</label>
          <input type="tel" id="phone" class="form-control" placeholder="0901234567">
        </div>
        <div class="form-group">
          <label>Mật khẩu <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required>
        </div>
        <button type="submit" class="btn-yellow" style="margin-top: 15px;">
          <i class="fa-solid fa-check"></i> Tạo tài khoản
        </button>
      </form>
      <p style="margin-top: 16px; font-size: 13px;">
        Đã có tài khoản? <a href="login.html" style="color: #000; font-weight: bold;">Đăng nhập ngay</a>
      </p>
    </div>
  </div>
<script src="js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        fullname: document.getElementById('fullname').value.trim(),
        user_code: document.getElementById('user_code').value.trim(),
        role: document.getElementById('role').value,
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        // Gửi dữ liệu đến API Đăng ký
        const res = await API.post('/api/auth/register', payload);
        
        if (res.success) {
          alert('Tạo tài khoản thành công! Đang chuyển hướng vào hệ thống...');
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          
          if (res.user.role === 'admin') {
            window.location.href = 'admin/reports.html';
          } else if (res.user.role === 'technician') {
            window.location.href = 'technician/dashboard.html';
          } else {
            window.location.href = 'student/create-report.html';
          }
        } else {
          alert(res.message);
        }
      } catch (error) {
        console.error('Lỗi kết nối:', error);
        alert('Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại server!');
      }
    });
  </script>
</body>
</html>
