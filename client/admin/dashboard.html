<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSVC - TVU | Dashboard Quản trị</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <i class="fa-solid fa-wrench"></i> CSVC - TVU (Quản trị)
    </div>
    <div class="nav-links">
      <a href="dashboard.html" style="text-decoration: underline;"><i class="fa-solid fa-chart-pie"></i> Tổng quan</a>
      <a href="reports.html"><i class="fa-solid fa-list-check"></i> Quản lý phản ánh</a>
      <a href="../index.html"><i class="fa-solid fa-house"></i> Về trang chủ</a>
    </div>
  </nav>

  <div class="container" style="max-width: 1200px;">
    <h2><i class="fa-solid fa-chart-line"></i> Tổng quan hệ thống</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Thống kê tình hình tiếp nhận và xử lý sự cố cơ sở vật chất.</p>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px;">
      <div class="card" style="padding: 20px; text-align: center; margin: 0;">
        <h3 style="font-size: 28px; color: #007bff;" id="statTotal">0</h3>
        <p style="color: #666; font-size: 14px;">Tổng số phản ánh</p>
      </div>
      <div class="card" style="padding: 20px; text-align: center; margin: 0;">
        <h3 style="font-size: 28px; color: #dc3545;" id="statReceived">0</h3>
        <p style="color: #666; font-size: 14px;">Chưa tiếp nhận</p>
      </div>
      <div class="card" style="padding: 20px; text-align: center; margin: 0;">
        <h3 style="font-size: 28px; color: #ffc107;" id="statProgress">0</h3>
        <p style="color: #666; font-size: 14px;">Đang xử lý</p>
      </div>
      <div class="card" style="padding: 20px; text-align: center; margin: 0;">
        <h3 style="font-size: 28px; color: #28a745;" id="statCompleted">0</h3>
        <p style="color: #666; font-size: 14px;">Đã hoàn thành</p>
      </div>
    </div>

    <div class="card" style="padding: 20px; text-align: center;">
      <p>Truy cập vào mục <a href="reports.html" style="color: #b8860b; font-weight: bold;">Quản lý phản ánh</a> để tiến hành điều phối kỹ thuật viên.</p>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats');
        const json = await res.json();
        if (json.success) {
          document.getElementById('statTotal').innerText = json.data.total;
          document.getElementById('statReceived').innerText = json.data.received;
          document.getElementById('statProgress').innerText = json.data.inProgress;
          document.getElementById('statCompleted').innerText = json.data.completed;
        }
      } catch (err) {
        console.error('Lỗi tải thống kê:', err);
      }
    }
    window.onload = loadStats;
  </script>
</body>
</html>
