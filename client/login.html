<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập | CSVC - TVU</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: rgba(0,0,0,0.4);">
  <div class="center-box">
    <div class="login-card">
      <div style="background: var(--tvu-yellow); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
        <i class="fa-solid fa-graduation-cap" style="font-size: 32px;"></i>
      </div>
      <h2>CSVC - TVU</h2>
      <p style="font-size: 13px; color: #666; margin-top: 4px;">Hệ thống Tiếp nhận & Theo dõi Phản ánh Sự cố</p>
      <div class="slogan-pill">“Tận tâm - Minh bạch - Thân thiện - Sáng tạo”</div>

      <form id="loginForm" style="text-align: left;">
        <div class="form-group">
          <label>Họ và tên của bạn <span class="required">*</span></label>
          <input type="text" id="fullname" class="form-control" placeholder="Ví dụ: Sơn Thị Ngọc Dung..." required>
        </div>
        <div class="form-group">
          <label>Mã số (MSSV / Mã Cán bộ) <span class="required">*</span></label>
          <input type="text" id="user_code" class="form-control" placeholder="Ví dụ: DA24TTB..." required>
        </div>
        <div class="form-group">
          <label>Vai trò của bạn <span class="required">*</span></label>
          <select id="role" class="form-control" required>
            <option value="student">Sinh viên</option>
            <option value="lecturer">Giảng viên</option>
            <option value="technician">Kỹ thuật viên</option>
            <option value="admin">Ban quản lý (Admin)</option>
          </select>
        </div>
        <button type="submit" class="btn-yellow" style="margin-top: 20px;">
          <i class="fa-solid fa-right-to-bracket"></i> Vào Hệ Thống Ngay
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullname: document.getElementById('fullname').value,
        user_code: document.getElementById('user_code').value,
        role: document.getElementById('role').value
      };

      const res = await API.post('/api/auth/login', payload);
      if (res.success) {
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        
        if (res.user.role === 'admin') window.location.href = 'admin/reports.html';
        else if (res.user.role === 'technician') window.location.href = 'technician/dashboard.html';
        else window.location.href = 'student/create-report.html';
      } else {
        alert(res.message);
      }
    });
  </script>
</body>
</html>
